# Minimal, purpose-built radiusd.conf for the privacyIDEA container.
# Validated against FreeRADIUS 3.2.5 (freeradius -XC).
prefix = /usr
libdir = /usr/lib/freeradius
pidfile = /tmp/radiusd.pid

log {
    destination = stdout
    level = info
    auth = yes
}

# Sized for the push-poll use case: a polling request occupies a worker for the
# duration of the wait, so allow plenty of concurrent workers. Tune to your load
# and to the number of concurrent push authentications you expect.
thread pool {
    start_servers = 5
    max_servers = 64
    min_spare_servers = 3
    max_spare_servers = 10
    max_requests_per_server = 0
}

modules {
    $INCLUDE ${confdir}/mods-enabled/
}

instantiate {
}

$INCLUDE ${confdir}/clients.conf
$INCLUDE ${confdir}/sites-enabled/
