name: Perl Tests

on:
  push:
  pull_request:
    branches:
      - 'master'
      - 'branch-*'

permissions:
  contents: read

jobs:
  perl_tester:
    runs-on: ubuntu-latest
    name: "perl v${{ matrix.perl-version }}"

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - "5.16"  # CentOS 7
          - "5.26"  # Ubuntu 18.04 / RHEL8
          - "5.30"  # Ubuntu 20.04
          - "5.34"  # Ubuntu 22.04

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: uses install-with-cpanm
        uses: perl-actions/install-with-cpanm@10d60f00b4073f484fc29d45bfbe2f776397ab3d # v1.7
        with:
          cpanfile: "cpanfile"
          sudo: false
      - run: perl -Mstrict -Mdiagnostics -cw privacyidea_radius.pm
      - name: Unit tests (poll logic)
        run: prove -v tests/poll.t
